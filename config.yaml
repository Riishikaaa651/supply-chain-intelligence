paths:
  db: data/supply_chain.db
  cleaned_data: data/processed/eda_cleaned_dataset.csv
  delay_model: models/delay_prediction_model.joblib
  shortage_model: models/shortage_prediction_model.joblib

thresholds:
  delay: 0.5
  shortage: 0.5


llm:
  provider: groq
  model: openai/gpt-oss-120b
  temperature: 0.2
  max_tokens: 2000
  timeout_seconds: 30

prompts:
  active_delay_briefing_version: v3
  active_delay_whatif_version: v4
  active_shortage_briefing_version: v3
  active_shortage_whatif_version: v4

whatif_questions:
  delay:
    - "What if we ship this order with First Class instead?"
    - "What if we switch this order to Same Day shipping?"
    - "What if we upgrade to Second Class?"
    - "What if we switch to Standard Class?"
    - "What if this order is sent to Western Europe instead?"
    - "What if the delivery takes 2 days longer than scheduled?"
  shortage:
    - "What if demand for this product rises by 20% next week?"
    - "What if demand drops by 30%?"
    - "What if demand doubles?"
    - "What if the demand variability (standard deviation) doubles?"
    - "What if demand rises by one standard deviation?"
    - "What if demand rises by 50%?"

api:
  title: Supply Chain Decision Intelligence API
  version: 0.1.0
  host: 127.0.0.1
  port: 8000